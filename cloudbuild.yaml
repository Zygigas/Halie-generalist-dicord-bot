steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA', '.']
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA']
  
  - name: Trigger Google Cloud Build
    run: |-
      gcloud builds submit \
      --substitutions=_DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }} \
      --config=cloudbuild.yaml .

  #debug verify discord token actually exists after build.
  - name: 'ubuntu'
    args: ['bash', '-c', 'echo "Token length received: ${#_DISCORD_TOKEN} characters"']

  # Deploy to Compute Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    args:
      - -c
      - |
        # Create a temporary SSH key
        ssh-keygen -t rsa -f /root/.ssh/id_rsa -q -N ""
        
        # Add the public key to the instance metadata
        gcloud compute instances add-metadata discord-bot-instance \
          --zone=us-west1-c \
          --metadata=ssh-keys="cloud-build:$(cat /root/.ssh/id_rsa.pub)"
        
        # Wait for the metadata to propagate
        sleep 30
        
        # SSH into the instance and deploy
        gcloud compute ssh discord-bot-instance \
          --zone=us-west1-c \
          --tunnel-through-iap \
          --ssh-key-file=/root/.ssh/id_rsa \
          --command="
            sudo gcloud auth configure-docker --quiet
            sudo docker stop discord-bot || true
            sudo docker rm discord-bot || true
            sudo docker pull gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA
            sudo docker run -d \
              --name discord-bot \
              --restart unless-stopped \
              -e DISCORD_TOKEN=${_DISCORD_TOKEN} \
              -e NODE_ENV=production \
              gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA
          "

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE