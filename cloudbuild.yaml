steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA', '.']
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA']
  
  # Deploy to Compute Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'discord-bot-instance'
      - '--zone=us-west1-c' 
      - '--command'
      - |
        docker stop discord-bot || true
        docker rm discord-bot || true
        docker pull gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA
        docker run -d \
          --name discord-bot \
          --restart unless-stopped \
          -e DISCORD_TOKEN=${_DISCORD_TOKEN} \
          gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA

# Optional: Clean up old images
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY 
  substitution_option: ALLOW_LOOSE

substitutions:
  _DISCORD_TOKEN: 'DISCORD_TOKEN'  # Will be replaced by secret