steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA', '.']
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA']

  # Deploy to Compute Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    args:
      - -c
      - |
        # Create SSH directory and key
        mkdir -p /root/.ssh
        chmod 700 /root/.ssh
        ssh-keygen -t rsa -f /root/.ssh/id_rsa -q -N ""

        # Add key to instance metadata
        gcloud compute instances add-metadata discord-bot-instance \
          --zone=us-west1-c \
          --metadata=ssh-keys="cloud-build:$(cat /root/.ssh/id_rsa.pub)"
        
        # Execute deployment commands
        gcloud compute ssh discord-bot-instance \
          --zone=us-west1-c \
          --tunnel-through-iap \
          --ssh-key-file=/root/.ssh/id_rsa \
          --command="
            sudo -E bash -c '\
              gcloud auth configure-docker --quiet && \
              docker stop discord-bot || true && \
              docker rm discord-bot || true && \
              docker pull gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA && \
              docker run -d \
                --name discord-bot \
                --restart unless-stopped \
                 -e DISCORD_TOKEN='$$DISCORD_TOKEN' \
                 -e CLIENT_ID='$$CLIENT_ID' \
                 -e DATABASE_LOGIN='$$DATABASE_LOGIN' \
                gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA
            '
          "
    secretEnv: ['DISCORD_TOKEN', CLIENT_ID, DATABASE_LOGIN]

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/DISCORD_BOT_TOKEN/versions/latest
    env: 'DISCORD_TOKEN'
  - versionName: projects/$PROJECT_ID/secrets/CLIENT_ID/versions/latest
    env: 'CLIENT_ID'
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_LOGIN/versions/latest
    env: 'DATABASE_LOGIN'

options:
  logging: CLOUD_LOGGING_ONLY