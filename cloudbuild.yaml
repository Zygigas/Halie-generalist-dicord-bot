# Deploy to Compute Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    args:
      - -c
      - |
        # SSH key setup remains the same
        mkdir -p /root/.ssh
        chmod 700 /root/.ssh
        ssh-keygen -t rsa -f /root/.ssh/id_rsa -q -N ""
        gcloud compute instances add-metadata discord-bot-instance \
          --zone=us-west1-c \
          --metadata=ssh-keys="cloud-build:$(cat /root/.ssh/id_rsa.pub)"
        
        # Execute deployment commands on the remote instance
        gcloud compute ssh discord-bot-instance \
          --zone=us-west1-c \
          --tunnel-through-iap \
          --ssh-key-file=/root/.ssh/id_rsa \
          --command="
            # Create a temporary environment file to safely handle the JSON secret.
            # The 'EOF' heredoc ensures the content is written literally.
            cat <<'EOF' > /tmp/bot.env
DISCORD_TOKEN='$$DISCORD_TOKEN'
CLIENT_ID='$$CLIENT_ID'
DATABASE_LOGIN='$$DATABASE_LOGIN'
EOF

            # Authenticate Docker with gcloud
            gcloud auth configure-docker --quiet

            # Stop and remove the old container
            sudo docker stop discord-bot || true
            sudo docker rm discord-bot || true

            # Pull the new image
            sudo docker pull gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA

            # Run the new container using the environment file and gcplogs
            sudo docker run -d \
              --name discord-bot \
              --restart unless-stopped \
              --log-driver=gcplogs \
              --env-file /tmp/bot.env \
              gcr.io/$PROJECT_ID/discord-bot:$COMMIT_SHA

            # Clean up the temporary secrets file
            rm /tmp/bot.env
          "
    secretEnv: ['DISCORD_TOKEN', 'CLIENT_ID', 'DATABASE_LOGIN']